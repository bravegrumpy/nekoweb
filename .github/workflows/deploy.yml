on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
          node-version: [24]
    name: deploy2nekoweb
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: deploy2nekoweb
        uses: indiefellas/deploy2nekoweb@main
        with: 
          nekoweb-api-key: ${{ secrets.NEKOWEB_API_KEY }}
          nekoweb-domain: 'bravegrumpy.nekoweb.org'
          nekoweb-username: 'bravegrumpy'
          directory: 'dist'
