on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    name: deploy2nekoweb
    steps:
      - name: Checkout
        uses: actions/checkout@master
      
      - name: Build
        uses: TartanLlama/actions-eleventy@master
      
      - name: deploy2nekoweb
        uses: indiefellas/deploy2nekoweb@main
        with: 
          nekoweb-api-key: ${{ secrets.NEKOWEB_TOKEN }}
          nekoweb-domain: 'bravegrumpy.nekoweb.org'
          nekoweb-username: 'bravegrumpy'
          directory: 'dist'