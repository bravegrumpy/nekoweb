on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    name: deploy2nekoweb
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Deps
        run: bun install --frozen-lockfile

      - name: Build
        run: bunx @11ty/eleventy
      
      - name: deploy2nekoweb
        uses: indiefellas/deploy2nekoweb@main
        with: 
          nekoweb-api-key: ${{ secrets.NEKOWEB_API_KEY }}
          nekoweb-domain: 'bravegrumpy.nekoweb.org'
          nekoweb-username: 'bravegrumpy'
          directory: 'dist'